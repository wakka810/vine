[workspace]
members = ["crates/vine-core", "crates/vine-cpu-profile", "crates/vine-pe-probe", "crates/vine-runtime-wasm", "crates/vine-recompiler", "crates/vine-x87", "crates/vine-shared-memory"]
exclude = [".work/vine-v86"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
encoding_rs = "=0.8.35"
goblin = { version = "=0.10.7", default-features = false, features = ["std", "pe32", "endian_fd"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
