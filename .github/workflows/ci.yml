name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Commit-bound private evidence may reference an implementation
          # commit older than the evidence-only HEAD commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install LLVM 22.1.8
        run: |
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          root="$RUNNER_TEMP/llvm-mingw"
          curl -fsSL \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz \
            -o "$archive"
          echo "534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda  $archive" \
            | sha256sum --check
          mkdir -p "$root"
          tar -xJf "$archive" --strip-components=1 -C "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - run: npm ci

      - run: npm run check:fast
        env:
          VINE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          VINE_WASM_CLANG: /usr/bin/clang

      - run: npm run check:fixture-e2e
        env:
          VINE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Run v86 browser benchmark gate
        run: npm run check:runtime:v86-benchmark:prepared
        env:
          VINE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload v86 browser benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v86-browser-benchmark-${{ runner.os }}
          path: |
            .work/v86-browser-benchmark/report.json
            .work/v86-browser-benchmark/benchmark.png
            .work/toolchain-spike/report.json
            .work/browser-runtime/browser-report.json
            .work/browser-runtime/build-manifest.json
          if-no-files-found: warn
