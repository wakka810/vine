name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install LLVM 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-22 lld-22 llvm-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - run: npm ci

      - run: npm run check:fast
        env:
          VINE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - run: npm run check:fixture-e2e
        env:
          VINE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
