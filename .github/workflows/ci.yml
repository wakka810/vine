name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # llvm-mingw supplies PE fixtures but omits the WebAssembly backend.
      VINE_X87_CC: /usr/bin/clang
      VINE_X87_AR: /usr/bin/llvm-ar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 151.0.7922.34
      - name: Install PE fixture compiler
        run: |
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          root="$RUNNER_TEMP/llvm-mingw"
          curl -fsSL \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz \
            -o "$archive"
          echo "534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda  $archive" | sha256sum --check
          mkdir -p "$root"
          tar -xJf "$archive" --strip-components=1 -C "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check:toolchain
        env:
          VINE_WASM_CLANG: /usr/bin/clang
      - run: npm run typecheck:runtime:browser-worker && npm run check:js && node tools/test-source-explorer.mjs && node tools/test-writable-tree.mjs
      - run: cargo fmt --all --check && cargo test --workspace --locked && cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: npm run prepare:engine
      - run: npm run prepare:media
      - run: npm run check:runtime:browser-worker:prepared && node tools/test-pe-inspection.mjs
        env:
          VINE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
