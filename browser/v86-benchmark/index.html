<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vine v86 Benchmark</title>
    <link rel="stylesheet" href="./benchmark.css" />
  </head>
  <body data-benchmark-status="idle">
    <header>
      <div class="brand-mark" aria-hidden="true">V</div>
      <div>
        <h1>Vine v86 Benchmark</h1>
        <p id="benchmark-phase" aria-live="polite">Ready</p>
      </div>
      <button id="run-benchmark" type="button">Run benchmark</button>
    </header>
    <main>
      <section>
        <div class="section-heading">
          <span>Engine gate</span>
          <h2>Measured results</h2>
        </div>
        <table>
          <tbody id="benchmark-results">
            <tr><th scope="row">Status</th><td>Not run</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./benchmark-main.js"></script>
  </body>
</html>
