<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vine Play</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; background: #090b0d; color: #f3f5f7; font: 14px system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; grid-template-rows: auto 1fr; }
      header { display: flex; min-height: 48px; align-items: center; gap: 12px; padding: 7px 12px; background: #14181c; border-bottom: 1px solid #30363c; }
      output { flex: 1; overflow: hidden; color: #cbd2d8; text-overflow: ellipsis; white-space: nowrap; }
      nav { display: flex; gap: 8px; }
      a, button { border: 1px solid #46515b; border-radius: 5px; background: #20262c; color: #f3f5f7; padding: 6px 10px; font: inherit; text-decoration: none; cursor: pointer; }
      a[aria-current="page"] { border-color: #43a58c; color: #72d6ba; }
      button:disabled { cursor: default; opacity: .45; }
      main { display: grid; min-height: 0; place-items: center; padding: 12px; }
      canvas { display: block; width: min(1280px, calc(100vw - 24px)); height: auto; max-height: calc(100vh - 72px); background: #000; border: 1px solid #30363c; outline: none; touch-action: none; }
      canvas:focus-visible { border-color: #43a58c; }
      @media (max-width: 700px) { header { flex-wrap: wrap; } output { order: 3; flex-basis: 100%; } }
    </style>
  </head>
  <body>
    <header>
      <button id="start" type="button">開始</button>
      <button id="stop" type="button" disabled>停止</button>
      <output id="status">開始を押してください</output>
      <nav aria-label="実行モード">
        <a id="normal-mode" href="?mode=normal">通常</a>
        <a id="performance-mode" href="?mode=performance">性能優先</a>
      </nav>
    </header>
    <main>
      <canvas id="surface" width="1280" height="720" tabindex="0" aria-label="ゲーム画面"></canvas>
    </main>
    <script type="module" src="./bgi-play.js"></script>
  </body>
</html>
