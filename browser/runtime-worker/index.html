<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vine</title>
    <style>
      body { font: 16px system-ui, sans-serif; background: #111; color: #eee; margin: 2rem auto; max-width: 800px; padding: 0 1rem; }
      header { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
      button, select { background: #292929; color: inherit; border: 1px solid #777; border-radius: 4px; padding: .6rem; cursor: pointer; text-align: left; }
      button:disabled { opacity: .4; cursor: default; }
      ul { padding: 0; list-style: none; }
      li button { width: 100%; margin-bottom: .25rem; }
      output { display: block; margin: 1rem 0; overflow-wrap: anywhere; }
      #status[role="alert"] { white-space: pre-wrap; }
      #game-surface { display: block; max-width: 100%; height: auto; }
      body:has(#game-surface) #listing { display: none; }
      .guest-message-box { color: #111; background: #f5f5f5; border: 1px solid #777; border-radius: 6px; max-width: min(36rem, 85vw); }
      .guest-message-box::backdrop { background: #0007; }
      .guest-message-box h2 { font-size: 1.1rem; margin-top: 0; }
      .guest-message-box p { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 55vh; overflow: auto; }
      .guest-message-buttons { display: flex; justify-content: flex-end; gap: .5rem; }
      .guest-message-buttons button { color: #111; background: #eee; text-align: center; min-width: 5rem; }
    </style>
  </head>
  <body>
    <header><button id="choose">Choose game directory</button><button id="back" disabled>Up</button><button id="launch" disabled>Launch selected executable</button></header>
    <p><label for="execution-mode">Execution mode</label> <select id="execution-mode"><option value="fast">Fast — experimental</option><option value="strict">Strict — baseline</option></select></p>
    <output id="location" aria-label="Current folder"></output>
    <ul id="listing" aria-label="Folders and executables"></ul>
    <output id="status" role="status">Choose a directory to browse executables.</output>
    <div id="surface"></div>
    <script type="module" src="./play.js"></script>
  </body>
</html>
